[workspace]
members = ["crates/core", "crates/simulator", "crates/input", "crates/emulator", "apps/tui", "apps/host"]
default-members = ["apps/tui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
sofalink-core = { path = "crates/core" }
sofalink-simulator = { path = "crates/simulator" }
sofalink-emulator = { path = "crates/emulator" }
sofalink-input = { path = "crates/input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
